name: weekly-paper
# Paper portfolio for the weekly strategy that passed the locked-year test (vote_voltgt on BTC, 20 USDT, checked daily: the exact live setup).
# Checked daily, rebalanced every 7 days. Shares the paper-state branch with the hourly job,
# so both use the same concurrency group and never overwrite each other.
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Restore paper accounts
        run: |
          if git ls-remote --exit-code origin paper-state >/dev/null; then
            git fetch -q origin paper-state
            mkdir -p state && git --work-tree=state checkout origin/paper-state -- . && git reset -q
          fi
      - name: Daily check / weekly rebalance
        run: python -m jevbot weekly-paper --strategy vote_voltgt --every-days 1 --symbols BTCUSDT --start-usdt 20
      - name: Rehearse the real-money program (dry run, live prices, no orders)
        run: |
          WEEKLY_BUDGET_USDT=20 WEEKLY_MAX_LOSS_USDT=5 python -m jevbot weekly-live \
            --strategy vote_voltgt --every-days 1 --symbols BTCUSDT --force | tee state/REHEARSAL.txt
      - name: Alerts (opens a GitHub issue, which notifies you, only when something needs attention)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m jevbot alerts --out state/ALERTS.md
          python -m jevbot market || true
          cat state/MARKET_ALERTS.md >> state/ALERTS.md 2>/dev/null || true
          if [ -s state/ALERTS.md ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "jevbot alert $(date -u +%F)" --body-file state/ALERTS.md
          fi
      - name: Save paper accounts
        run: |
          cd state
          git init -q -b paper-state
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "weekly paper $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" paper-state
