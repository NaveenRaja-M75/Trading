name: monthly-plan
# On the 1st of each month: how to split new money between Nifty, gold and the crypto bot, and
# progress toward the $10/day goal. Edit my/holdings.json (rupee values + monthly_add) to update it.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Restore state
        run: |
          if git ls-remote --exit-code origin paper-state >/dev/null; then
            git fetch -q origin paper-state
            mkdir -p state && git --work-tree=state checkout origin/paper-state -- . && git reset -q
          fi
      - name: This month's plan
        run: python -m jevbot plan --out state/MONTHLY_PLAN.md
      - name: Save
        run: |
          cd state
          git init -q -b paper-state
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "monthly plan $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" paper-state
