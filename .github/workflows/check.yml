name: check
# Runs every safety test, then backtests every signal on REAL Binance data.
on:
  push:
    branches-ignore: [backtest-results]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas pytest matplotlib
      - run: mkdir -p reports
      - name: Safety and correctness tests
        shell: bash
        run: python -m pytest -v 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Backtest 1h candles, 1 year, 4 coins
        run: INTERVAL=1h python -m jevbot backtest --days 365 --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT | tee reports/bt_1h.txt
      - name: Backtest 4h candles, 3 years, 4 coins
        run: INTERVAL=4h python -m jevbot backtest --days 1095 --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT --plot 2 | tee reports/bt_4h.txt
      - name: Backtest daily candles, 7 years, 4 coins
        run: INTERVAL=1d python -m jevbot backtest --days 2555 --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT --plot 3 | tee reports/bt_1d.txt
      - name: Stress test chart_vote, 10 coins x 6 periods x 5 settings, 1h, 3 years
        run: INTERVAL=1h python -m jevbot robust --with-baselines | tee reports/robust_1h.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-reports
          path: reports/
      - name: Save results to the backtest-results branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mv test-output.txt reports/ 2>/dev/null || true
          cd reports
          git init -q -b backtest-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "commit ${GITHUB_SHA}  run ${GITHUB_RUN_ID}" > RUN.txt
          git add -A && git commit -qm "results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" backtest-results
