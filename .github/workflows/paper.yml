name: paper
# Forward test with fake money: every hour, one chart_vote decision per coin on 1h candles.
# Results and the trade log live on the paper-state branch (see STATUS.md there).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Restore paper accounts
        run: |
          if git ls-remote --exit-code origin paper-state >/dev/null; then
            git fetch -q origin paper-state
            mkdir -p state && git --work-tree=state checkout origin/paper-state -- . && git reset -q
          fi
      - name: One decision per coin
        run: INTERVAL=1h MAX_POSITION_USDT=50 DAILY_LOSS_LIMIT_USDT=5 python -m jevbot paper-once --signal chart_vote
      - name: Save paper accounts
        run: |
          cd state
          git init -q -b paper-state
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "paper step $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" paper-state
