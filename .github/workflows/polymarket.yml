name: research
# Runs one read-only research script. Places no orders or bets.
on:
  workflow_dispatch:
    inputs:
      script:
        description: research script to run
        default: research/polymarket_probe.py
      args:
        description: arguments
        default: ""

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy matplotlib
      - run: mkdir -p reports
      - name: Run
        run: PYTHONPATH=. python ${{ inputs.script }} ${{ inputs.args }} 2>&1 | tee reports/out.txt
      - name: Save results to a results-<script> branch
        if: success()
        run: |
          branch="results-$(basename ${{ inputs.script }} .py)"
          cd reports
          git init -q -b "$branch"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "research ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" "$branch"
